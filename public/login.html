<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blemm Studios - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #3b1760 0%, #170b22 45%, #0d0912 100%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: rgba(25, 17, 31, 0.95);
            border: 1px solid #32203d;
            border-radius: 18px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(139, 77, 204, 0.12);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #b77aff;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #b9a8c4;
            font-size: 15px;

            margin-bottom: 30px;
            line-height: 1.5;
        }

        .discord-button {
            width: 100%;
            padding: 15px 20px;

            border: none;
            border-radius: 10px;

            background: #5865F2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .discord-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(88, 101, 242, 0.35);
        }

        .discord-icon {
            margin-right: 8px;
        }

        .info {
            margin-top: 25px;

            color: #806f8c;
            font-size: 13px;
            line-height: 1.6;
        }

        .message {
            margin-top: 18px;

            color: #ff6b6b;
            font-size: 14px;

            display: none;
        }

        .footer {
            margin-top: 25px;

            color: #5e5068;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            Welcome Back!
        </div>

        <p class="subtitle">
            Sign in to Blemm Studios
        </p>

        <button class="discord-button" onclick="loginWithDiscord()">
            <span class="discord-icon">💬</span>
            Continue with Discord
        </button>

        <p class="message" id="message"></p>

        <p class="info">
            You'll use your Discord account to access commissions
            and submit requests.
        </p>

        <div class="footer">
            Blemm Studios
        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
